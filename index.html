<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 359</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght,WONK@400,1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000000;
    color: #F5F1E8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }
  .content { display: flex; flex-direction: column; align-items: center; }
  .logo { max-width: min(480px, 80vw); height: auto; }
  p {
    font-family: "Fraunces", serif;
    font-weight: 400;
    font-optical-sizing: none;
    font-variation-settings: 'wght' 400, 'WONK' 1;
    font-size: clamp(1.6rem, 4.5vw, 2.25rem);
    letter-spacing: 0.02em;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
  <div class="content">
    <img class="logo" src="the-359-white-transparent.png" alt="The 359">
    <p>Coming Soon</p>
  </div>
</body>
</html>
